# Every push: run the tests, build the app's image, and check the AWS setup.
# To publish a new image for the club's server: Actions tab → "Test and publish" →
# "Run workflow". GitHub never signs in to AWS; you deploy from your computer
# with infra/deploy.sh (see docs/aws.md).
name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the app's image after the checks pass"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install
        run: pip install ".[server,test]"
      - name: Tests
        run: python -m pytest -q tests
      - name: The club web app starts and answers
        run: |
          RBO_AUTH=off RBO_DATA="$RUNNER_TEMP/data" racebox-overlay serve --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/api/state
          curl -fsS localhost:8080/ | grep -q 'const WEB = {"email"'

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t racebox-overlay:ci .
      - name: The image runs the app
        run: |
          docker run -d --name rbo -p 8080:8080 -e RBO_AUTH=off racebox-overlay:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/api/state
          docker exec rbo ffmpeg -hide_banner -version | head -1
          docker exec rbo python -c "from rbo import hud; print(hud.Hud.__name__, hud.FONT_CANDIDATES[-3])"
          docker logs rbo

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDK
        run: pip install -r infra/requirements.txt
      - name: Check the AWS setup builds (cdk synth)
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: npx -y aws-cdk@2 synth --quiet

  publish:
    needs: [test, image, infra]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GitHub's image registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$image:latest" -t "$image:${GITHUB_SHA::12}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .
          docker push --all-tags "$image"
          {
            echo "Published \`$image:latest\`."
            echo
            echo "To put it on the club's server, run \`infra/deploy.sh restart\` on your computer"
            echo "(or \`infra/deploy.sh\` if you changed anything in \`infra/\`)."
          } >> "$GITHUB_STEP_SUMMARY"
