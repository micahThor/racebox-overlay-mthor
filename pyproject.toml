[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "racebox-overlay"
version = "0.1.0"
description = "Overlay RaceBox lap timer data (laps, sectors, track map, G-force, lean) onto Insta360 / action-cam video"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pillow>=10.1"]

[project.scripts]
racebox-overlay = "rbo.cli:main"

[tool.setuptools]
packages = ["rbo"]
