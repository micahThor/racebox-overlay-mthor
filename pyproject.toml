[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "racebox-overlay"
version = "0.1.0"
description = "Overlay RaceBox lap timer data (laps, sectors, track map, G-force, lean) onto Insta360 / action-cam video"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pillow>=10.1"]

[project.optional-dependencies]
# the club web app (racebox-overlay serve): sign-in checks and AWS
server = ["pyjwt[crypto]>=2.8", "boto3>=1.34"]
test = ["pytest>=7"]

[project.scripts]
racebox-overlay = "rbo.cli:main"

[tool.setuptools]
packages = ["rbo"]

[tool.setuptools.package-data]
rbo = ["gui.html", "fonts/*.ttf", "fonts/*.txt"]
